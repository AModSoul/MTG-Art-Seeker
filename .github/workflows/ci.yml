name: CI

on:
  push:
    branches: [trunk]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Git hooks are for local commits only.
  HUSKY: 0

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install the libraries Tauri builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The desktop crate embeds dist/ when it compiles.
      - run: npm run build

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      - name: TypeScript bindings match the Rust types
        run: |
          npm run bindings
          git diff --exit-code src/bindings || (echo "Run npm run bindings and commit the result." && exit 1)

  frontend:
    name: Front end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint -- --format github
      - run: npm run format:check
      - run: npm run typecheck

      # Unit tests, and every story as a browser test in headless Chromium.
      - run: npx playwright install --with-deps chromium
      - run: npm test

      - run: npm run build
